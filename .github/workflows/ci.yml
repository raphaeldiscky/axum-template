name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Installs rust, node and pnpm from .prototools — the single source of
      # truth for every toolchain version in this repo.
      - name: Setup Toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # proto installs Rust natively via rustup, into ~/.cargo/bin, but only
      # puts its own shim dirs on PATH.
      - name: Add Cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Install Dependencies
        run: task sync

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Lint
        run: task lint

      - name: Dead Code Check
        run: task deadcode

      - name: Security Check
        run: task security

      - name: Unused Deps Check
        run: task unused_deps

      - name: Test
        run: task test

      - name: Build Check
        run: task build
