services:
  postgres:
    container_name: user-db
    image: postgres:18-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - axum-template
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  axum-template:
    name: axum-template
    external: true
